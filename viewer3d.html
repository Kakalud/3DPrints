<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przeglądarka STL & 3MF</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #121214; 
            color: #e4e4e7; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header { 
            background: #18181b; 
            padding: 12px 24px; 
            border-bottom: 1px solid #27272a; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { 
            font-size: 1.1rem; 
            color: #2dd4bf; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        header a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
        }
        header a:hover { color: #2dd4bf; }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 49px);
        }

        .sidebar {
            width: 320px;
            background: #18181b;
            border-right: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f4f4f5;
            margin-bottom: 4px;
        }

        .sidebar-subtitle {
            font-size: 0.8rem;
            color: #71717a;
            margin-bottom: 16px;
        }

        .refresh-btn {
            background: #27272a;
            color: #2dd4bf;
            border: 1px solid #3f3f46;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .stl-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stl-item {
            background: #27272a;
            border: 1px solid #3f3f46;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
        }
        .stl-item.active {
            border-color: #2dd4bf;
            background: rgba(45, 212, 191, 0.15);
        }

        .stl-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .loading-state {
            padding: 24px 12px;
            text-align: center;
            color: #a1a1aa;
            font-size: 0.85rem;
        }

        .viewport {
            flex: 1;
            position: relative;
            background: #09090b;
        }
        #canvas-3d {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    
    <!-- Stabilna wersja Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Wymagane Loadery -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <!-- Tradycyjny JSZip wymagany przez 3MFLoader w r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/3MFLoader.js"></script>
</head>
<body>

    <header>
        <h1>Przeglądarka 3D</h1>
        <a href="index.html">&larr; Powrót do menu</a>
    </header>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-title">Pliki z GitHuba</div>
            <div class="sidebar-subtitle">Wykrywa pliki .stl oraz .3mf</div>

            <button class="refresh-btn" id="btn-refresh">Odśwież listę</button>

            <div class="stl-list" id="stl-list">
                <div class="loading-state">Pobieranie listy...</div>
            </div>
        </div>

        <div class="viewport">
            <canvas id="canvas-3d"></canvas>
        </div>
    </div>

<script>
    var scene, camera, renderer, controls;
    var currentGroup = null;
    var modelFiles = [];
    var activeIdx = -1;

    var GITHUB_USER = 'Kakalud';
    var GITHUB_REPO = '3DPrints';

    function init3D() {
        var container = document.querySelector('.viewport');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x09090b);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(100, 100, 100);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        var grid = new THREE.GridHelper(200, 40, 0x3f3f46, 0x27272a);
        grid.position.y = -0.1;
        scene.add(grid);

        var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        var dirLight1 = new THREE.DirectionalLight(0x2dd4bf, 0.8);
        dirLight1.position.set(1, 1, 1).normalize();
        scene.add(dirLight1);

        var dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight2.position.set(-1, -1, -1).normalize();
        scene.add(dirLight2);

        window.addEventListener('resize', function() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function loadModel(url, fileName) {
        if (currentGroup) {
            scene.remove(currentGroup);
            currentGroup = null;
        }

        var ext = fileName.split('.').pop().toLowerCase();
        var material = new THREE.MeshStandardMaterial({
            color: 0x2dd4bf,
            roughness: 0.3,
            metalness: 0.2
        });

        currentGroup = new THREE.Group();
        scene.add(currentGroup);

        if (ext === 'stl') {
            var stlLoader = new THREE.STLLoader();
            stlLoader.load(url, function(geometry) {
                geometry.computeVertexNormals();
                geometry.center();
                var mesh = new THREE.Mesh(geometry, material);
                currentGroup.add(mesh);
                fitCamera();
            });
        } else if (ext === '3mf') {
            var mfLoader = new THREE.3MFLoader();
            mfLoader.load(url, function(object) {
                object.traverse(function(child) {
                    if (child.isMesh) {
                        child.material = material;
                    }
                });
                var box = new THREE.Box3().setFromObject(object);
                var center = box.getCenter(new THREE.Vector3());
                object.position.sub(center);
                currentGroup.add(object);
                fitCamera();
            });
        }
    }

    function fitCamera() {
        if (!currentGroup) return;
        var box = new THREE.Box3().setFromObject(currentGroup);
        var size = box.getSize(new THREE.Vector3());
        var maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim === 0) maxDim = 100;
        
        camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
        camera.lookAt(0, 0, 0);
        controls.target.set(0, 0, 0);
    }

    function fetchRepoFiles() {
        var listContainer = document.getElementById('stl-list');
        listContainer.innerHTML = '<div class="loading-state">Pobieranie listy...</div>';

        var apiUrl = 'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/';

        fetch(apiUrl)
            .then(function(res) {
                if (!res.ok) throw new Error('Błąd API: ' + res.status);
                return res.json();
            })
            .then(function(data) {
                if (!Array.isArray(data)) throw new Error('Niepoprawne dane.');

                modelFiles = [];
                for (var i = 0; i < data.length; i++) {
                    var file = data[i];
                    // Upewniamy się, że to plik (omija foldery) i ma poprawne rozszerzenie
                    if (file.type === 'file') {
                        var name = file.name.toLowerCase();
                        if (name.endsWith('.stl') || name.endsWith('.3mf')) {
                            modelFiles.push({
                                name: file.name,
                                url: file.download_url
                            });
                        }
                    }
                }

                if (modelFiles.length === 0) {
                    listContainer.innerHTML = '<div class="loading-state">Brak modeli.</div>';
                    return;
                }
                renderList();
                selectItem(0);
            })
            .catch(function(err) {
                listContainer.innerHTML = '<div class="loading-state" style="color:red;">Błąd: ' + err.message + '</div>';
            });
    }

    function renderList() {
        var container = document.getElementById('stl-list');
        container.innerHTML = '';
        
        for (var i = 0; i < modelFiles.length; i++) {
            (function(idx) {
                var div = document.createElement('div');
                div.className = 'stl-item' + (idx === activeIdx ? ' active' : '');
                div.innerHTML = '<span class="stl-name">' + modelFiles[idx].name + '</span>';
                div.onclick = function() { selectItem(idx); };
                container.appendChild(div);
            })(i);
        }
    }

    window.selectItem = function(idx) {
        if (idx < 0 || idx >= modelFiles.length) return;
        activeIdx = idx;
        renderList();
        loadModel(modelFiles[idx].url, modelFiles[idx].name);
    };

    document.getElementById('btn-refresh').onclick = fetchRepoFiles;

    init3D();
    fetchRepoFiles();
</script>
</body>
</html>
