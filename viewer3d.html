<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przeglądarka STL 3D - Repozytorium</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121214; 
            color: #e4e4e7; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header { 
            background: #18181b; 
            padding: 12px 24px; 
            border-bottom: 1px solid #27272a; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        header h1 { 
            font-size: 1.1rem; 
            color: #2dd4bf; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        header a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        header a:hover { color: #2dd4bf; }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 49px);
        }

        /* Sidebar for repository STL list */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: #18181b;
            border-right: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f4f4f5;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-subtitle {
            font-size: 0.8rem;
            color: #71717a;
            margin-bottom: 16px;
        }

        .refresh-btn {
            background: #27272a;
            color: #2dd4bf;
            border: 1px solid #3f3f46;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
            transition: background 0.2s;
        }
        .refresh-btn:hover { background: #3f3f46; }

        .stl-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stl-item {
            background: #27272a;
            border: 1px solid #3f3f46;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .stl-item:hover { border-color: #2dd4bf; }
        .stl-item.active {
            border-color: #2dd4bf;
            background: rgba(45, 212, 191, 0.15);
            font-weight: 600;
        }

        .stl-icon {
            color: #2dd4bf;
            flex-shrink: 0;
        }

        .stl-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .loading-state, .empty-state {
            padding: 24px 12px;
            text-align: center;
            color: #a1a1aa;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* 3D Viewport */
        .viewport {
            flex: 1;
            position: relative;
            background: #09090b;
        }
        #canvas-3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info-overlay {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(6px);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #27272a;
            font-size: 0.8rem;
            color: #a1a1aa;
        }
    </style>
    <!-- Three.js + STLLoader + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header>
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            Przeglądarka Repozytorium 3D
        </h1>
        <a href="index.html">&larr; Powrót do menu głównego</a>
    </header>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                Pliki STL z Repozytorium
            </div>
            <div class="sidebar-subtitle">Automatycznie pobierane z projektu Kakalud/3DPrints</div>

            <button class="refresh-btn" id="btn-refresh">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                Odśwież listę
            </button>

            <div class="stl-list" id="stl-list">
                <div class="loading-state">Pobieranie listy plików z GitHub...</div>
            </div>
        </div>

        <div class="viewport">
            <canvas id="canvas-3d"></canvas>
            <div class="info-overlay" id="info-overlay">LPM = obrót | PPM = przesunięcie | Rolka = powiększenie</div>
        </div>
    </div>

<script>
    var scene, camera, renderer, controls, currentMesh;
    var stlFiles = [];
    var activeIdx = -1;

    // GitHub repository configuration
    var GITHUB_USER = 'Kakalud';
    var GITHUB_REPO = '3DPrints';

    function init3D() {
        var container = document.querySelector('.viewport');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x09090b);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(100, 100, 100);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        var grid = new THREE.GridHelper(200, 40, 0x3f3f46, 0x27272a);
        grid.position.y = -0.1;
        scene.add(grid);

        var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        var dirLight1 = new THREE.DirectionalLight(0x2dd4bf, 0.8);
        dirLight1.position.set(1, 1, 1).normalize();
        scene.add(dirLight1);

        var dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight2.position.set(-1, -1, -1).normalize();
        scene.add(dirLight2);

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        var container = document.querySelector('.viewport');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function loadSTLFromUrl(url) {
        var loader = new THREE.STLLoader();
        loader.load(url, function(geometry) {
            geometry.computeVertexNormals();
            geometry.center();

            var material = new THREE.MeshStandardMaterial({
                color: 0x2dd4bf,
                roughness: 0.3,
                metalness: 0.2
            });

            if (currentMesh) scene.remove(currentMesh);

            currentMesh = new THREE.Mesh(geometry, material);
            
            geometry.computeBoundingBox();
            var box = geometry.boundingBox;
            var maxDim = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z);
            camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);

            scene.add(currentMesh);
        }, undefined, function(err) {
            console.error('Błąd podczas ładowania STL:', err);
        });
    }

    function fetchRepoSTLFiles() {
        var listContainer = document.getElementById('stl-list');
        listContainer.innerHTML = '<div class="loading-state">Pobieranie listy plików z GitHub...</div>';

        var apiUrl = 'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/';

        fetch(apiUrl)
            .then(function(response) {
                if (!response.ok) throw new Error('API HTTP error ' + response.status);
                return response.json();
            })
            .then(function(data) {
                stlFiles = data.filter(function(file) {
                    return file.name.toLowerCase().endsWith('.stl');
                }).map(function(file) {
                    return {
                        name: file.name,
                        url: './' + file.name
                    };
                });

                if (stlFiles.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state">Brak plików .stl w repozytorium. Umieść plik STL w głównym folderze git.</div>';
                    return;
                }

                renderList();
                selectItem(0);
            })
            .catch(function(err) {
                console.warn('Fallback: nie udało się połączyć z API GitHub, pobieranie z lokalnego foldera:', err);
                stlFiles = [
                    { name: 'rura_custom.stl', url: './rura_custom.stl' }
                ];
                renderList();
                selectItem(0);
            });
    }

    function renderList() {
        var container = document.getElementById('stl-list');
        container.innerHTML = '';
        stlFiles.forEach(function(item, idx) {
            var div = document.createElement('div');
            div.className = 'stl-item' + (idx === activeIdx ? ' active' : '');
            div.onclick = function() { selectItem(idx); };
            div.innerHTML = `
                <svg class="stl-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                <span class="stl-name" title="${item.name}">${item.name}</span>
            `;
            container.appendChild(div);
        });
    }

    window.selectItem = function(idx) {
        if (idx < 0 || idx >= stlFiles.length) return;
        activeIdx = idx;
        renderList();
        loadSTLFromUrl(stlFiles[idx].url);
    };

    document.getElementById('btn-refresh').onclick = fetchRepoSTLFiles;

    init3D();
    fetchRepoSTLFiles();
</script>
</body>
</html>
