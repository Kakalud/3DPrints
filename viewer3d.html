<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przeglądarka STL & 3MF 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121214; 
            color: #e4e4e7; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header { 
            background: #18181b; 
            padding: 12px 24px; 
            border-bottom: 1px solid #27272a; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        header h1 { 
            font-size: 1.1rem; 
            color: #2dd4bf; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        header a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        header a:hover { color: #2dd4bf; }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 49px);
        }

        .sidebar {
            width: 320px;
            min-width: 320px;
            background: #18181b;
            border-right: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f4f4f5;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-subtitle {
            font-size: 0.8rem;
            color: #71717a;
            margin-bottom: 16px;
        }

        .refresh-btn {
            background: #27272a;
            color: #2dd4bf;
            border: 1px solid #3f3f46;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
            transition: background 0.2s;
        }
        .refresh-btn:hover { background: #3f3f46; }

        .stl-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stl-item {
            background: #27272a;
            border: 1px solid #3f3f46;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .stl-item:hover { border-color: #2dd4bf; }
        .stl-item.active {
            border-color: #2dd4bf;
            background: rgba(45, 212, 191, 0.15);
            font-weight: 600;
        }

        .stl-icon {
            color: #2dd4bf;
            flex-shrink: 0;
        }

        .stl-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .loading-state, .empty-state {
            padding: 24px 12px;
            text-align: center;
            color: #a1a1aa;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .viewport {
            flex: 1;
            position: relative;
            background: #09090b;
        }
        #canvas-3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info-overlay {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(6px);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #27272a;
            font-size: 0.8rem;
            color: #a1a1aa;
        }
    </style>
    <!-- Three.js + JSZip + STLLoader + 3MFLoader + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/3MFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header>
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            Przeglądarka STL & 3MF 3D
        </h1>
        <a href="index.html">&larr; Powrót do menu głównego</a>
    </header>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                Pliki z Repozytorium
            </div>
            <div class="sidebar-subtitle">Pobiera pliki .stl oraz .3mf bezpośrednio z GitHuba</div>

            <button class="refresh-btn" id="btn-refresh">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                Odśwież listę
            </button>

            <div class="stl-list" id="stl-list">
                <div class="loading-state">Ładowanie plików z GitHub...</div>
            </div>
        </div>

        <div class="viewport">
            <canvas id="canvas-3d"></canvas>
            <div class="info-overlay" id="info-overlay">LPM = obrót | PPM = przesunięcie | Rolka = powiększenie</div>
        </div>
    </div>

<script>
    var scene, camera, renderer, controls, currentObject;
    var modelFiles = [];
    var activeIdx = -1;

    var GITHUB_USER = 'Kakalud';
    var GITHUB_REPO = '3DPrints';

    function init3D() {
        var container = document.querySelector('.viewport');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x09090b);

        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(100, 100, 100);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        var grid = new THREE.GridHelper(200, 40, 0x3f3f46, 0x27272a);
        grid.position.y = -0.1;
        scene.add(grid);

        var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        var dirLight1 = new THREE.DirectionalLight(0x2dd4bf, 0.8);
        dirLight1.position.set(1, 1, 1).normalize();
        scene.add(dirLight1);

        var dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight2.position.set(-1, -1, -1).normalize();
        scene.add(dirLight2);

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        var container = document.querySelector('.viewport');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function loadModel(url, fileName) {
        if (currentObject) {
            scene.remove(currentObject);
            currentObject = null;
        }

        var ext = fileName.split('.').pop().toLowerCase();
        var material = new THREE.MeshStandardMaterial({
            color: 0x2dd4bf,
            roughness: 0.3,
            metalness: 0.2
        });

        if (ext === 'stl') {
            var loader = new THREE.STLLoader();
            loader.load(url, function(geometry) {
                geometry.computeVertexNormals();
                geometry.center();

                var mesh = new THREE.Mesh(geometry, material);
                currentObject = mesh;
                scene.add(currentObject);
                fitCameraToObject(geometry);
            }, undefined, function(err) {
                console.error('Błąd ładowania STL:', err);
            });
        } else if (ext === '3mf') {
            var loader = new THREE.3MFLoader();
            loader.load(url, function(object) {
                object.traverse(function(child) {
                    if (child.isMesh) {
                        child.material = material;
                        child.geometry.computeVertexNormals();
                    }
                });

                var box = new THREE.Box3().setFromObject(object);
                var center = box.getCenter(new THREE.Vector3());
                object.position.sub(center);

                currentObject = object;
                scene.add(currentObject);
                fitCameraToObjectBox(box);
            }, undefined, function(err) {
                console.error('Błąd ładowania 3MF:', err);
            });
        }
    }

    function fitCameraToObject(geometry) {
        geometry.computeBoundingBox();
        var box = geometry.boundingBox;
        var maxDim = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z);
        camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
        camera.lookAt(0, 0, 0);
        controls.target.set(0, 0, 0);
    }

    function fitCameraToObjectBox(box) {
        var size = box.getSize(new THREE.Vector3());
        var maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
        camera.lookAt(0, 0, 0);
        controls.target.set(0, 0, 0);
    }

    function fetchRepoFiles() {
        var listContainer = document.getElementById('stl-list');
        listContainer.innerHTML = '<div class="loading-state">Pobieranie listy modeli z GitHub...</div>';

        var apiUrl = 'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/';

        fetch(apiUrl)
            .then(function(response) {
                if (!response.ok) throw new Error('API HTTP error ' + response.status);
                return response.json();
            })
            .then(function(data) {
                modelFiles = data.filter(function(file) {
                    var name = file.name.toLowerCase();
                    return name.endsWith('.stl') || name.endsWith('.3mf');
                }).map(function(file) {
                    return {
                        name: file.name,
                        // Użycie bezpośredniego adresu z GitHub RAW rozwiąże problem z typem MIME dla .3mf
                        url: file.download_url || ('./' + file.name)
                    };
                });

                if (modelFiles.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state">Brak plików .stl lub .3mf w głównym folderze.</div>';
                    return;
                }

                renderList();
                selectItem(0);
            })
            .catch(function(err) {
                console.error('Błąd połączenia z API GitHub:', err);
                listContainer.innerHTML = '<div class="empty-state">Nie udało się pobrać listy plików. Odśwież stronę.</div>';
            });
    }

    function renderList() {
        var container = document.getElementById('stl-list');
        container.innerHTML = '';
        modelFiles.forEach(function(item, idx) {
            var div = document.createElement('div');
            div.className = 'stl-item' + (idx === activeIdx ? ' active' : '');
            div.onclick = function() { selectItem(idx); };
            div.innerHTML = `
                <svg class="stl-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                <span class="stl-name" title="${item.name}">${item.name}</span>
            `;
            container.appendChild(div);
        });
    }

    window.selectItem = function(idx) {
        if (idx < 0 || idx >= modelFiles.length) return;
        activeIdx = idx;
        renderList();
        loadModel(modelFiles[idx].url, modelFiles[idx].name);
    };

    document.getElementById('btn-refresh').onclick = fetchRepoFiles;

    init3D();
    fetchRepoFiles();
</script>
</body>
</html>
